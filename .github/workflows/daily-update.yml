name: Daily AI ecosystem update
on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update AI news
        run: python update.py
      - name: Commit updated data
        run: |
          git config user.name "AI Ecosystem Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Daily AI ecosystem update"
          git push
